<!DOCTYPE html>
<html>
<head>
  <title>Live Alerts</title>
  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
  <style>
    body { font-family: Arial; padding: 20px; }
    #alert { font-size: 22px; color: red; margin-top: 20px; }
  </style>
</head>
<body>

<h2>Live Alerts</h2>
<div id="alert">Waiting for alerts...</div>

<script>
  const socket = io("https://noncircular-shonta-garbledly.ngrok-free.dev", {
    transports: ["websocket"]
  });

  socket.on("connect", () => {
    console.log("✅ WebSocket connected");
    document.getElementById("alert").innerText = "Connected to server";
  });

  socket.on("disconnect", () => {
    console.log("❌ WebSocket disconnected");
    document.getElementById("alert").innerText = "Disconnected from server";
  });

  socket.on("alert", (message) => {
    console.log("📨 Alert received:", message);
    document.getElementById("alert").innerText = message;

    speechSynthesis.speak(
      new SpeechSynthesisUtterance(message)
    );
  });

  socket.on("connect_error", (err) => {
    console.error("⚠️ Connection error:", err);
    document.getElementById("alert").innerText = "Connection error";
  });
</script>


</body>
</html>
